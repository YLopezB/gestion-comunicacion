services:
  db:
    image: postgres:17-alpine
    container_name: gestor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/create-databases.sh:/create-databases.sh:ro
    command: sh /create-databases.sh

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/user-service:/app
      - user_node_modules:/app/node_modules
    ports:
      - "${PORT_USER_SERVICE}:${PORT_USER_SERVICE}"
    environment:
      PORT: ${PORT_USER_SERVICE}
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

  repository-service:
    build:
      context: ./services/repository-service
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/repository-service:/app
      - repository_node_modules:/app/node_modules
    ports:
      - "${PORT_REPOSITORY_SERVICE}:${PORT_REPOSITORY_SERVICE}"
    environment:
      PORT: ${PORT_REPOSITORY_SERVICE}
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/auth-service:/app
      - auth_node_modules:/app/node_modules
    ports:
      - "${PORT_AUTH_SERVICE}:${PORT_AUTH_SERVICE}"
    environment:
      PORT: ${PORT_AUTH_SERVICE}
      DB_HOST: db
      DB_PORT: "${POSTGRES_PORT}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

  company-service:
    build:
      context: ./services/company-service
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/company-service:/app
      - company_node_modules:/app/node_modules
    ports:
      - "${PORT_COMPANY_SERVICE}:${PORT_COMPANY_SERVICE}"
    environment:
      PORT: ${PORT_COMPANY_SERVICE}
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-service
      - company-service
      - auth-service
      - repository-service

volumes:
  postgres_data:
  user_node_modules:
  repository_node_modules:
  frontend_node_modules:
  auth_node_modules:
  company_node_modules:
