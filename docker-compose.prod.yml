services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/create-databases.sh:/create-databases.sh:ro
    command: sh /create-databases.sh

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      PORT: ${PORT_USER_SERVICE}
      DB_HOST: db
      DB_PORT: "${POSTGRES_PORT}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

  repository-service:
    build:
      context: ./services/repository-service
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      PORT: ${PORT_REPOSITORY_SERVICE}
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      PORT: "${PORT_AUTH_SERVICE}"
      DB_HOST: db
      DB_PORT: "${POSTGRES_PORT}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

  company-service:
    build:
      context: ./services/company-service
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      PORT: "${PORT_COMPANY_SERVICE}"
      DB_HOST: db
      DB_PORT: "${POSTGRES_PORT}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NAME_COMPANY: ${NAME_COMPANY}
      SLOGAN_COMPANY: ${SLOGAN_COMPANY}
    depends_on:
      db-init:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - user-service
      - company-service
      - auth-service
      - repository-service

volumes:
  postgres_data:
